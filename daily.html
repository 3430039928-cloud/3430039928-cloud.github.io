<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生活随笔｜我的私人小站</title>
  <link rel="stylesheet" href="style.css?v=5">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="container">
    <div class="page-head">
      <h1>生活随笔</h1>
      <p class="sub">三餐、买菜日常、琐碎心事 —— 登录后存云端、跨设备同步；未登录存本机</p>
    </div>

    <!-- 新增一篇 -->
    <div class="add-area">
      <input type="text" id="titleInput" placeholder="标题（如：11 月 4 日 日常）">
      <textarea id="bodyInput" placeholder="今天发生了什么？想说什么都行……"></textarea>
      <div class="row" style="margin-top:10px; justify-content: space-between;">
        <span class="muted" style="color:var(--muted);font-size:13px">空内容不会保存</span>
        <button class="btn btn-primary btn-sm" id="addBtn">写下来</button>
      </div>
    </div>

    <div id="list"></div>
  </main>

  <!-- 随笔查看/编辑弹层（仿日历） -->
  <div class="cal-modal" id="dvModal">
    <div class="cal-modal-card">
      <h3 id="dvTitle">—</h3>
      <div id="dvViewBox">
        <div class="cal-modal-sub">这篇随笔</div>
        <div class="cal-view-text" id="dvViewText"></div>
        <div class="cal-modal-ops">
          <button class="btn btn-ghost btn-sm" id="dvEditBtn">编辑</button>
          <button class="btn btn-ghost btn-sm btn-del" id="dvDelBtn">删除</button>
          <button class="btn btn-ghost btn-sm" id="dvCloseBtn">关闭</button>
        </div>
      </div>
      <div id="dvEditBox" style="display:none">
        <div class="cal-modal-sub">修改这篇随笔</div>
        <input type="text" id="dvName" placeholder="标题">
        <textarea id="dvBody" placeholder="今天发生了什么？想说什么都行……"></textarea>
        <div class="cal-modal-ops">
          <button class="btn btn-ghost btn-sm btn-del" id="dvDelBtn2">删除</button>
          <button class="btn btn-ghost btn-sm" id="dvBackBtn">返回</button>
          <button class="btn btn-primary btn-sm" id="dvSaveBtn">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="site.js"></script>
  <script src="cloud.js"></script>
  <script>
  (function () {
    var KIND = 'daily';
    var seed = [
      { id: App.uid(), title: '08 月 07 日 日常记录', body: '可以写下做饭、买菜、上班心情、放上食物截图之类的生活碎片。这条是示例，点右下角「删除」即可去掉。', created_at: '2026-08-07T09:00:00' }
    ];

    var list = [];
    function save(l) { App.saveList(KIND, l); }

    function render() {
      var box = App.$('list');
      var sorted = list.slice().sort(function (a, b) {
        return new Date(b.created_at) - new Date(a.created_at);
      });
      if (!sorted.length) {
        box.innerHTML = '<div class="empty">还没有随笔，在上方写第一篇吧。</div>';
        return;
      }
      box.innerHTML = sorted.map(function (r) {
        return '<article class="item" id="ditem-' + r.id + '">' +
          '<div class="head"><h3>' + App.escapeHtml(r.title || '（无标题）') + '</h3>' +
          '<span class="when">' + App.escapeHtml(App.fmtDate(r.created_at)) + '</span></div>' +
          '<div class="body">' + App.escapeHtml(r.body) + '</div>' +
          '</article>';
      }).join('');
    }

    App.on('addBtn', 'click', function () {
      var title = App.$('titleInput').value.trim();
      var body = App.$('bodyInput').value.trim();
      if (!title && !body) { App.toast('标题和内容都空着呢', 'err'); return; }
      list.push({ id: App.uid(), title: title, body: body, created_at: new Date().toISOString() });
      save(list);
      App.$('titleInput').value = '';
      App.$('bodyInput').value = '';
      render();
      App.toast('已写下');
    });

    App.$('list').addEventListener('click', function (e) {
      var card = e.target.closest('.item');
      if (!card) return;
      dvShowView(card.id.replace('ditem-', ''));
    });

    // ===== 查看 / 编辑（仿日历弹层）=====
    var editId = '';
    function dvFind(id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
    function dvShowView(id) {
      var rec = dvFind(id); if (!rec) return; editId = id;
      App.$('dvTitle').textContent = rec.title || '（无标题）';
      App.$('dvViewText').textContent = rec.body || '（没有内容）';
      App.$('dvViewBox').style.display = ''; App.$('dvEditBox').style.display = 'none';
      App.$('dvModal').classList.add('show');
    }
    function dvShowEdit(id) {
      var rec = dvFind(id); if (!rec) return; editId = id;
      App.$('dvTitle').textContent = rec.title || '（无标题）';
      App.$('dvName').value = rec.title || '';
      App.$('dvBody').value = rec.body || '';
      App.$('dvEditBox').style.display = ''; App.$('dvViewBox').style.display = 'none';
      App.$('dvModal').classList.add('show'); App.$('dvName').focus();
    }
    function dvClose() { App.$('dvModal').classList.remove('show'); editId = ''; }
    function dvSave() {
      if (!editId) return; var rec = dvFind(editId); if (!rec) return;
      var title = App.$('dvName').value.trim();
      var body = App.$('dvBody').value.trim();
      if (!title && !body) { App.toast('标题和内容都空着呢', 'err'); return; }
      rec.title = title; rec.body = body; save(list); dvClose(); render(); App.toast('已保存');
    }
    function dvDel() {
      if (!editId) return;
      list = list.filter(function (r) { return r.id !== editId; });
      save(list); dvClose(); render(); App.toast('已删除', 'err');
    }
    App.on('dvEditBtn', 'click', function () { if (editId) dvShowEdit(editId); });
    App.on('dvCloseBtn', 'click', dvClose);
    App.on('dvBackBtn', 'click', function () { if (editId) dvShowView(editId); });
    App.on('dvSaveBtn', 'click', dvSave);
    App.on('dvDelBtn', 'click', dvDel);
    App.on('dvDelBtn2', 'click', dvDel);
    App.on('dvModal', 'click', function (e) { if (e.target === this) dvClose(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') dvClose(); });

    App.loadList(KIND, seed).then(function (d) { list = d || []; render(); });
  })();
  </script>
</body>
</html>
