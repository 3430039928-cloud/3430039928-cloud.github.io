<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影｜我的私人小站</title>
  <link rel="stylesheet" href="style.css?v=5">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="container">
    <div class="page-head">
      <h1>观影相册</h1>
      <p class="sub">海报、评分与随手记下的感受 —— 登录后存云端、跨设备同步；未登录存本机</p>
    </div>

    <div class="add-area">
      <input type="text" id="nameInput" placeholder="影片名">
      <input type="text" id="infoInput" placeholder="年份｜类型｜你的打分，如：2026｜动画｜★★★★">
      <div class="row" style="margin-top:10px; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" id="pickBtn" type="button">选海报</button>
        <input type="file" id="imgInput" accept="image/*" style="display:none">
        <span id="imgName" class="muted" style="color:var(--muted);font-size:13px"></span>
        <button class="btn btn-ghost btn-sm" id="clearImgBtn" type="button" style="display:none">移除海报</button>
      </div>
      <div id="imgPrevWrap" style="margin-top:10px; display:none;">
        <img id="imgPrev" style="max-height:140px; border-radius:10px; border:1px solid var(--line);">
      </div>
      <div class="row" style="margin-top:10px; justify-content: space-between;">
        <span class="muted" style="color:var(--muted);font-size:13px">空名字不会保存 · 海报可选</span>
        <button class="btn btn-primary btn-sm" id="addBtn">加进相册</button>
      </div>
    </div>

    <div class="ov" id="ov">
      <div class="ov-head" id="ovHead"><span>电影墙 · 点击封面看观后感</span><span class="ov-count" id="ovCount"></span></div>
      <div class="wall-grid" id="ovList"></div>
    </div>

    <div class="movie-grid" id="grid"></div>
  </main>

  <!-- 影片查看/编辑弹层（仿日历） -->
  <div class="cal-modal" id="mvModal">
    <div class="cal-modal-card">
      <h3 id="mvTitle">—</h3>

      <!-- 查看模式（只读） -->
      <div id="mvViewBox">
        <div class="cal-modal-sub">这部影片</div>
        <div id="mvViewPoster"></div>
        <div class="m-stars" id="mvViewStars"></div>
        <div class="cal-view-text" id="mvViewText"></div>
        <div class="cal-modal-ops">
          <button class="btn btn-ghost btn-sm" id="mvEditBtn">编辑</button>
          <button class="btn btn-ghost btn-sm btn-del" id="mvDelBtn">删除</button>
          <button class="btn btn-ghost btn-sm" id="mvCloseBtn">关闭</button>
        </div>
      </div>

      <!-- 编辑模式 -->
      <div id="mvEditBox" style="display:none">
        <div class="cal-modal-sub" id="mvEditSub">修改这部影片</div>
        <input type="text" id="mvName" placeholder="影片名">
        <textarea id="mvInfo" placeholder="年份｜类型｜你的打分，以及你的观后感……"></textarea>
        <div class="row" style="margin-top:4px; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" id="mvPickBtn" type="button">选海报</button>
          <input type="file" id="mvImgInput" accept="image/*" style="display:none">
          <span id="mvImgName" class="muted" style="color:var(--muted);font-size:13px"></span>
          <button class="btn btn-ghost btn-sm" id="mvClearImgBtn" type="button" style="display:none">移除海报</button>
        </div>
        <div id="mvImgPrevWrap" style="margin-top:10px; display:none;">
          <img id="mvImgPrev" style="max-height:150px; border-radius:10px; border:1px solid var(--line);">
        </div>
        <div class="cal-modal-ops">
          <button class="btn btn-ghost btn-sm btn-del" id="mvDelBtn2">删除</button>
          <button class="btn btn-ghost btn-sm" id="mvBackBtn">返回</button>
          <button class="btn btn-primary btn-sm" id="mvSaveBtn">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="site.js"></script>
  <script src="cloud.js"></script>
  <script>
  (function () {
    var KIND = 'movie';
    var seed = [
      { id: App.uid(), name: "Howl's Moving Castle", info: '2026-08-07｜动画', img: 'images/howl049.jpg', created_at: '2026-08-07T12:00:00' }
    ];
    var list = [];
    function save(l) { App.saveList(KIND, l); }

    function parseInfo(info) {
      if (!info) return { stars: '', text: '' };
      var stars = (info.match(/[★☆]+/) || [''])[0];
      var text = info.replace(/[★☆]+/, '').replace(/^[\s\|｜\-\—]+/, '').trim();
      return { stars: stars, text: text };
    }

    function render() {
      var box = App.$('grid');
      var sorted = list.slice().sort(function (a, b) {
        return new Date(b.created_at) - new Date(a.created_at);
      });
      if (!sorted.length) {
        box.innerHTML = '<div class="empty">还没有影片，在上方加第一部吧。</div>';
        App.$('ov').style.display = 'none';
        return;
      }
      box.innerHTML = sorted.map(function (r) {
        var poster = r.img
          ? '<img class="poster" src="' + App.escapeHtml(r.img) + '" alt="' + App.escapeHtml(r.name) + '">'
          : '<div class="poster ph">无海报</div>';
        var p = parseInfo(r.info);
        var right =
          '<h3 class="name">' + App.escapeHtml(r.name) + '</h3>' +
          (p.stars ? '<div class="m-stars">' + App.escapeHtml(p.stars) + '</div>' : '') +
          (p.text ? '<div class="info">' + App.escapeHtml(p.text) + '</div>' : '');
        return '<div class="movie" id="movie-' + r.id + '">' + poster +
          '<div class="m-main">' + right + '</div></div>';
      }).join('');
      renderOverview(sorted);
    }

    function renderOverview(items) {
      var ov = App.$('ovList');
      App.$('ov').style.display = '';
      App.$('ovCount').textContent = items.length + ' 部';
      ov.innerHTML = items.map(function (r) {
        var cover = r.img
          ? '<img src="' + App.escapeHtml(r.img) + '" alt="' + App.escapeHtml(r.name) + '">'
          : '<div class="wall-ph"><div class="t">' + App.escapeHtml(r.name) + '</div></div>';
        return '<a class="wall-item" data-id="' + r.id + '" href="#movie-' + r.id + '" title="' + App.escapeHtml(r.name) + '">' + cover + '</a>';
      }).join('');
    }

    var pendingImg = '';
    function handleFile(file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var max = 480, w = img.width, h = img.height;
          if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
          else if (h > max) { w = Math.round(w * max / h); h = max; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          try { pendingImg = canvas.toDataURL('image/jpeg', 0.82); }
          catch (err) { pendingImg = ''; App.toast('图片读取失败', 'err'); return; }
          App.$('imgPrev').src = pendingImg;
          App.$('imgPrevWrap').style.display = 'block';
          App.$('imgName').textContent = file.name;
          App.$('clearImgBtn').style.display = 'inline-block';
        };
        img.onerror = function () { App.toast('图片无法读取', 'err'); };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }
    App.on('pickBtn', 'click', function () { App.$('imgInput').click(); });
    App.on('imgInput', 'change', function () { handleFile(this.files[0]); this.value = ''; });
    App.on('clearImgBtn', 'click', function () {
      pendingImg = '';
      App.$('imgPrev').src = '';
      App.$('imgPrevWrap').style.display = 'none';
      App.$('imgName').textContent = '';
      this.style.display = 'none';
    });

    App.on('addBtn', 'click', function () {
      var name = App.$('nameInput').value.trim();
      var info = App.$('infoInput').value.trim();
      if (!name) { App.toast('影片名不能为空', 'err'); return; }
      list.push({ id: App.uid(), name: name, info: info, img: pendingImg, created_at: new Date().toISOString() });
      save(list);
      App.$('nameInput').value = '';
      App.$('infoInput').value = '';
      pendingImg = '';
      App.$('imgPrev').src = '';
      App.$('imgPrevWrap').style.display = 'none';
      App.$('imgName').textContent = '';
      App.$('clearImgBtn').style.display = 'none';
      render();
      App.toast(pendingImg ? '已加入相册（含海报）' : '已加入相册');
    });

    App.$('ovList').addEventListener('click', function (e) {
      var a = e.target.closest('.wall-item');
      if (!a) return;
      e.preventDefault();
      var el = document.getElementById('movie-' + a.getAttribute('data-id'));
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('flash');
        setTimeout(function () { el.classList.remove('flash'); }, 1200);
      }
    });
    App.on('ovHead', 'click', function () { App.$('ov').classList.toggle('collapsed'); });

    // ===== 查看 / 编辑（仿日历弹层）=====
    var editId = '';
    var editImg = '';

    function findBy(id) {
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    }

    function showView(id) {
      var rec = findBy(id);
      if (!rec) return;
      editId = id;
      App.$('mvTitle').textContent = rec.name || '（无标题）';
      App.$('mvViewPoster').innerHTML = rec.img
        ? '<img src="' + App.escapeHtml(rec.img) + '" alt="' + App.escapeHtml(rec.name) + '">'
        : '<div class="mv-ph">无海报</div>';
      var p = parseInfo(rec.info);
      App.$('mvViewStars').textContent = p.stars || '';
      App.$('mvViewStars').style.display = p.stars ? '' : 'none';
      App.$('mvViewText').textContent = p.text || '（没有写观后感）';
      App.$('mvViewBox').style.display = '';
      App.$('mvEditBox').style.display = 'none';
      App.$('mvModal').classList.add('show');
    }

    function showEdit(id) {
      var rec = findBy(id);
      if (!rec) return;
      editId = id;
      App.$('mvTitle').textContent = rec.name || '（无标题）';
      App.$('mvName').value = rec.name || '';
      App.$('mvInfo').value = rec.info || '';
      editImg = rec.img || '';
      if (editImg) {
        App.$('mvImgPrev').src = editImg;
        App.$('mvImgPrevWrap').style.display = 'block';
        App.$('mvImgName').textContent = '当前海报';
        App.$('mvClearImgBtn').style.display = 'inline-block';
      } else {
        App.$('mvImgPrev').src = '';
        App.$('mvImgPrevWrap').style.display = 'none';
        App.$('mvImgName').textContent = '';
        App.$('mvClearImgBtn').style.display = 'none';
      }
      App.$('mvEditBox').style.display = '';
      App.$('mvViewBox').style.display = 'none';
      App.$('mvModal').classList.add('show');
      App.$('mvName').focus();
    }

    function closeModal() {
      App.$('mvModal').classList.remove('show');
      editId = ''; editImg = '';
    }

    function saveMovie() {
      if (!editId) return;
      var rec = findBy(editId);
      if (!rec) return;
      var name = App.$('mvName').value.trim();
      if (!name) { App.toast('影片名不能为空', 'err'); return; }
      rec.name = name;
      rec.info = App.$('mvInfo').value.trim();
      rec.img = editImg;
      save(list);
      closeModal();
      render();
      App.toast('已保存');
    }

    function deleteMovie() {
      if (!editId) return;
      list = list.filter(function (r) { return r.id !== editId; });
      save(list);
      closeModal();
      render();
      App.toast('已删除', 'err');
    }

    function handleEditFile(file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var max = 480, w = img.width, h = img.height;
          if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
          else if (h > max) { w = Math.round(w * max / h); h = max; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          try { editImg = canvas.toDataURL('image/jpeg', 0.82); }
          catch (err) { editImg = ''; App.toast('图片读取失败', 'err'); return; }
          App.$('mvImgPrev').src = editImg;
          App.$('mvImgPrevWrap').style.display = 'block';
          App.$('mvImgName').textContent = file.name;
          App.$('mvClearImgBtn').style.display = 'inline-block';
        };
        img.onerror = function () { App.toast('图片无法读取', 'err'); };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    App.$('grid').addEventListener('click', function (e) {
      var card = e.target.closest('.movie');
      if (!card) return;
      showView(card.id.replace('movie-', ''));
    });
    App.on('mvEditBtn', 'click', function () { if (editId) showEdit(editId); });
    App.on('mvCloseBtn', 'click', closeModal);
    App.on('mvBackBtn', 'click', function () { if (editId) showView(editId); });
    App.on('mvSaveBtn', 'click', saveMovie);
    App.on('mvDelBtn', 'click', deleteMovie);
    App.on('mvDelBtn2', 'click', deleteMovie);
    App.on('mvPickBtn', 'click', function () { App.$('mvImgInput').click(); });
    App.on('mvImgInput', 'change', function () { handleEditFile(this.files[0]); this.value = ''; });
    App.on('mvClearImgBtn', 'click', function () {
      editImg = '';
      App.$('mvImgPrev').src = '';
      App.$('mvImgPrevWrap').style.display = 'none';
      App.$('mvImgName').textContent = '';
      this.style.display = 'none';
    });
    App.on('mvModal', 'click', function (e) { if (e.target === this) closeModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

    App.loadList(KIND, seed).then(function (d) { list = d || []; render(); });
  })();
  </script>
</body>
</html>
