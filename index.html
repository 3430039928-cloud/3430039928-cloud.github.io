<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的私人小站</title>
  <meta name="description" content="生活随笔、书影音记录、代办与待购买的个人小站">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>欢迎来到我的小站</h1>
      <p>这里收着我的生活随笔、看过的书与影，还有每天要做的那些小事和想买的东西。</p>
      <span class="date" id="today">—</span>
    </section>

    <section class="grid">
      <a class="card" href="daily.html">
        <div class="icon">📝</div>
        <h3>生活随笔</h3>
        <p>三餐、买菜日常、琐碎心事，随手记下来。</p>
      </a>

      <a class="card" href="media.html">
        <div class="icon">🎬</div>
        <h3>书影音</h3>
        <p>书架与片单：书分严肃文学和脆皮鸭，影一格一格收好。</p>
      </a>

      <a class="card" href="calendar.html">
        <div class="icon">📅</div>
        <h3>日历</h3>
        <p>一个月一页，每天一格，点格子记当天发生的事。</p>
      </a>

      <a class="card" href="notes.html">
        <div class="icon">✅</div>
        <h3>记录本</h3>
        <p>代办与待购买，勾选即完成，自动算剩余。</p>
      </a>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="site.js"></script>
  <script>
    (function () {
      var d = new Date();
      var week = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
      App.$('today').textContent =
        d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 星期' + week;
    })();
  </script>
</body>
</html>
