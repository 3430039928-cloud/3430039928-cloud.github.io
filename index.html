<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项 · TodoList</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="header-content">
                <h1 class="title">待办事项</h1>
                <p class="date" id="currentDate"></p>
            </div>
            <div class="header-right">
                <div class="sync-status" id="syncStatus" title="本地模式">
                    <span class="sync-dot"></span>
                    <span class="sync-text">本地</span>
                </div>
                <div class="stats">
                    <span class="stat-item">
                        <span class="stat-number" id="activeCount">0</span>
                        <span class="stat-label">未完成</span>
                    </span>
                    <span class="stat-divider"></span>
                    <span class="stat-item">
                        <span class="stat-number" id="completedCount">0</span>
                        <span class="stat-label">已完成</span>
                    </span>
                </div>
            </div>
        </header>

        <main class="app-main">
            <section class="input-section">
                <form class="todo-form" id="todoForm">
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <input
                            type="text"
                            id="todoInput"
                            class="todo-input"
                            placeholder="添加新的待办事项..."
                            autocomplete="off"
                            maxlength="200"
                        >
                        <div class="priority-selector">
                            <button type="button" class="priority-btn" data-priority="none" title="无优先级">
                                <span class="priority-dot none"></span>
                            </button>
                            <button type="button" class="priority-btn" data-priority="low" title="低优先级">
                                <span class="priority-dot low"></span>
                            </button>
                            <button type="button" class="priority-btn active" data-priority="medium" title="中优先级">
                                <span class="priority-dot medium"></span>
                            </button>
                            <button type="button" class="priority-btn" data-priority="high" title="高优先级">
                                <span class="priority-dot high"></span>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="add-btn">
                        <span>添加</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </form>
            </section>

            <section class="filter-section">
                <div class="filters" id="filters">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="active">未完成</button>
                    <button class="filter-btn" data-filter="completed">已完成</button>
                </div>
                <button class="clear-btn" id="clearCompleted">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                        <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>清除已完成</span>
                </button>
            </section>

            <section class="todo-list-section">
                <ul class="todo-list" id="todoList"></ul>
                <div class="empty-state" id="emptyState">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
                        <path d="M9 11l3 3L22 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <p class="empty-title">暂无待办事项</p>
                    <p class="empty-subtitle">添加一个新任务开始你的高效一天</p>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <span id="footerInfo">共 0 项待办</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
