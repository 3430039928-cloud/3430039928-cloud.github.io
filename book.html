<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书｜我的私人小站</title>
  <link rel="stylesheet" href="style.css?v=5">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="container">
    <div class="page-head">
      <h1>书架</h1>
      <p class="sub">严肃文学与脆皮鸭，分两个书架。登录后存云端、跨设备同步；未登录存本机</p>
    </div>

    <div class="tabs" id="tabs">
      <button data-cat="严肃文学" class="active">严肃文学</button>
      <button data-cat="脆皮鸭">脆皮鸭</button>
    </div>

    <div class="add-area">
      <input type="text" id="titleInput" placeholder="书名 / 作品名">
      <textarea id="noteInput" placeholder="摘抄、读后感悟，或一句话推荐……"></textarea>
      <div class="row" style="margin-top:10px; justify-content: space-between;">
        <span class="muted" style="color:var(--muted);font-size:13px" id="catHint">当前分类：严肃文学</span>
        <button class="btn btn-primary btn-sm" id="addBtn">加到书架</button>
      </div>
    </div>

    <div class="ov" id="ov">
      <div class="ov-head" id="ovHead"><span>📑 总览 · 只看书名</span><span class="ov-count" id="ovCount"></span></div>
      <div class="ov-list" id="ovList"></div>
    </div>

    <div id="list"></div>
  </main>

  <!-- 书查看/编辑弹层（仿日历） -->
  <div class="cal-modal" id="bkModal">
    <div class="cal-modal-card">
      <h3 id="bkTitle">—</h3>

      <div id="bkViewBox">
        <div class="cal-modal-sub" id="bkViewCat">这本</div>
        <div class="cal-view-text" id="bkViewText"></div>
        <div class="cal-modal-ops">
          <button class="btn btn-ghost btn-sm" id="bkEditBtn">编辑</button>
          <button class="btn btn-ghost btn-sm btn-del" id="bkDelBtn">删除</button>
          <button class="btn btn-ghost btn-sm" id="bkCloseBtn">关闭</button>
        </div>
      </div>

      <div id="bkEditBox" style="display:none">
        <div class="cal-modal-sub">修改这本</div>
        <input type="text" id="bkName" placeholder="书名 / 作品名">
        <select id="bkCat" style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff;margin-bottom:10px">
          <option value="严肃文学">严肃文学</option>
          <option value="脆皮鸭">脆皮鸭</option>
        </select>
        <textarea id="bkNote" placeholder="摘抄、读后感悟，或一句话推荐……"></textarea>
        <div class="cal-modal-ops">
          <button class="btn btn-ghost btn-sm btn-del" id="bkDelBtn2">删除</button>
          <button class="btn btn-ghost btn-sm" id="bkBackBtn">返回</button>
          <button class="btn btn-primary btn-sm" id="bkSaveBtn">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="site.js"></script>
  <script src="cloud.js"></script>
  <script>
  (function () {
    var KIND = 'book';
    var current = '严肃文学';
    var seed = [
      { id: App.uid(), cat: '严肃文学', title: '示例：百年孤独', note: '这是一条示例书摘，删掉它换上你自己的书。点右下角「删除」即可。', created_at: '2026-08-10T10:00:00' },
      { id: App.uid(), cat: '脆皮鸭', title: '示例：某篇同人', note: '脆皮鸭区放你喜欢的同人 / CP 文。同样可删除替换。', created_at: '2026-08-11T10:00:00' }
    ];
    var list = [];

    function save(l) { App.saveList(KIND, l); }

    function render() {
      var box = App.$('list');
      var items = list.filter(function (r) { return r.cat === current; })
        .sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
      if (!items.length) {
        box.innerHTML = '<div class="empty">这个书架空空的，在上方加一本吧。</div>';
        App.$('ov').style.display = 'none';
        return;
      }
      box.innerHTML = items.map(function (r) {
        return '<article class="item" id="item-' + r.id + '">' +
          '<div class="head"><h3>' + App.escapeHtml(r.title || '（无标题）') + '</h3>' +
          '<span class="when">' + App.escapeHtml(App.fmtDate(r.created_at)) + '</span></div>' +
          (r.note ? '<div class="body">' + App.escapeHtml(r.note) + '</div>' : '') +
          '</article>';
      }).join('');
      renderOverview(items);
    }

    function renderOverview(items) {
      var ov = App.$('ovList');
      App.$('ov').style.display = '';
      App.$('ovCount').textContent = items.length + ' 本';
      ov.innerHTML = items.map(function (r, i) {
        return '<a class="ov-item" data-id="' + r.id + '" href="#item-' + r.id + '">' +
          '<span class="ov-idx">' + (i + 1) + '</span>' +
          '<span class="ov-title">' + App.escapeHtml(r.title || '（无标题）') + '</span>' +
          (r.note ? '<span class="ov-dot" title="含笔记"></span>' : '') +
          '</a>';
      }).join('');
    }

    App.$('tabs').addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      current = btn.getAttribute('data-cat');
      Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) {
        b.classList.toggle('active', b === btn);
      });
      App.$('catHint').textContent = '当前分类：' + current;
      render();
    });

    App.on('addBtn', 'click', function () {
      var title = App.$('titleInput').value.trim();
      var note = App.$('noteInput').value.trim();
      if (!title && !note) { App.toast('书名和笔记都空着呢', 'err'); return; }
      list.push({ id: App.uid(), cat: current, title: title, note: note, created_at: new Date().toISOString() });
      save(list);
      App.$('titleInput').value = '';
      App.$('noteInput').value = '';
      render();
      App.toast('已加入「' + current + '」');
    });

    App.$('list').addEventListener('click', function (e) {
      var card = e.target.closest('.item');
      if (!card) return;
      bkShowView(card.id.replace('item-', ''));
    });

    App.$('ovList').addEventListener('click', function (e) {
      var a = e.target.closest('.ov-item');
      if (!a) return;
      e.preventDefault();
      var el = document.getElementById('item-' + a.getAttribute('data-id'));
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('flash');
        setTimeout(function () { el.classList.remove('flash'); }, 1200);
      }
    });
    App.on('ovHead', 'click', function () { App.$('ov').classList.toggle('collapsed'); });

    // ===== 查看 / 编辑（仿日历弹层）=====
    var editId = '';
    function bkFind(id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
    function bkShowView(id) {
      var rec = bkFind(id); if (!rec) return; editId = id;
      App.$('bkTitle').textContent = rec.title || '（无标题）';
      App.$('bkViewCat').textContent = (rec.cat || '') + ' · 这本';
      App.$('bkViewText').textContent = rec.note || '（没有写笔记）';
      App.$('bkViewBox').style.display = ''; App.$('bkEditBox').style.display = 'none';
      App.$('bkModal').classList.add('show');
    }
    function bkShowEdit(id) {
      var rec = bkFind(id); if (!rec) return; editId = id;
      App.$('bkTitle').textContent = rec.title || '（无标题）';
      App.$('bkName').value = rec.title || '';
      App.$('bkCat').value = rec.cat || '严肃文学';
      App.$('bkNote').value = rec.note || '';
      App.$('bkEditBox').style.display = ''; App.$('bkViewBox').style.display = 'none';
      App.$('bkModal').classList.add('show'); App.$('bkName').focus();
    }
    function bkClose() { App.$('bkModal').classList.remove('show'); editId = ''; }
    function bkSave() {
      if (!editId) return; var rec = bkFind(editId); if (!rec) return;
      var title = App.$('bkName').value.trim();
      var note = App.$('bkNote').value.trim();
      if (!title && !note) { App.toast('书名和笔记都空着呢', 'err'); return; }
      rec.title = title; rec.note = note; rec.cat = App.$('bkCat').value;
      save(list); bkClose(); render(); App.toast('已保存');
    }
    function bkDel() {
      if (!editId) return;
      list = list.filter(function (r) { return r.id !== editId; });
      save(list); bkClose(); render(); App.toast('已删除', 'err');
    }
    App.on('bkEditBtn', 'click', function () { if (editId) bkShowEdit(editId); });
    App.on('bkCloseBtn', 'click', bkClose);
    App.on('bkBackBtn', 'click', function () { if (editId) bkShowView(editId); });
    App.on('bkSaveBtn', 'click', bkSave);
    App.on('bkDelBtn', 'click', bkDel);
    App.on('bkDelBtn2', 'click', bkDel);
    App.on('bkModal', 'click', function (e) { if (e.target === this) bkClose(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') bkClose(); });

    App.loadList(KIND, seed).then(function (d) { list = d || []; render(); });
  })();
  </script>
</body>
</html>
